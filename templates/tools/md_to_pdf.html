{% block content %}

        <h1>{{ _t('Md To PDF Title') }}</h1>
        <p>{{ _t('Desc Md To PDF') }}</p>
    </div>

    <style>
        #page-size {

            background-repeat: no-repeat;

            padding-right: 2.5rem !important;

            background-color: #1e293b; /* Fallback dark color */
            color: #f8fafc;
        }

        .qty-input {

            border: 1px solid var(--border);

        }

            border: none;
            color: var(--text-muted);

            justify-content: center;
            cursor: pointer;

        }

            color: var(--primary);

        }
        #font-size {
            border: none !important;
            background: transparent !important;
            width: 40px !important;
            text-align: center;
            padding: 0 !important;
            font-weight: 600;
            -moz-appearance: textfield;
        }

            -webkit-appearance: none;
            margin: 0;
        }
    </style>

    <div style="display:flex; gap:1.2rem; margin-bottom:1rem; flex-wrap:wrap; align-items:center; background: var(--bg-card); padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
        <div style="display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; flex: 1;">
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <label for="page-size" style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; margin: 0;">{{ _t('Label Paper') }}</label>
                <select id="page-size" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text); outline: none; cursor: pointer;">
                    <option value="A4" selected>A4</option>
                    <option value="letter">Letter</option>
                    <option value="legal">Legal</option>
                    <option value="A5">A5</option>
                </select>
            </div>
            
            <div style="display: flex; align-items: center; gap: 0.6rem;">
                <label for="font-size" style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; margin: 0;">{{ _t('Label Font Size') }}</label>
                <div class="qty-input">
                    <button type="button" class="qty-btn" onclick="document.getElementById('font-size').stepDown()"><i class="bi bi-dash"></i></button>
                    <input type="number" id="font-size" value="11" min="8" max="18" readonly>
                    <button type="button" class="qty-btn" onclick="document.getElementById('font-size').stepUp()"><i class="bi bi-plus"></i></button>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 0.6rem;">
            <label for="file-name" style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; margin: 0;">{{ _t('Label Filename') }}</label>
            <input type="text" id="file-name" value="dokumen_{{ app_config.username|lower|replace(' ', '_') }}" style="width:180px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text); outline: none;">
            </div>
        </div>
        
        <div style="display: flex; gap: 0.8rem; align-items: center;">
            <input type="file" id="md-upload" accept=".md,.markdown,.txt" style="display:none" onchange="loadFile(this.files[0])">
            <button type="button" class="btn btn-outline" style="padding: 0.6rem 1rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;" onclick="document.getElementById('md-upload').click()">
                <i class="bi bi-folder2-open"></i> {{ _t('Open File') }}
            </button>
            <button class="btn btn-primary" style="padding: 0.6rem 1.2rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;" onclick="convertMD()">
                <i class="bi bi-file-pdf-fill"></i> {{ _t('Convert To PDF') }}
            </button>
        </div>
    </div>

    <textarea id="md-input" placeholder="# {{ _t('Lab Report Title') }}

{{ _t('Write Lecture Notes Here') }}

### {{ _t('Supported Features') }}
- {{ _t('Auto List Creation') }}
- {{ _t('Formula Writing') }}
- {{ _t('Program Code Example') }}
- {{ _t('Images And Links') }}

```python
{{ _t('Example Code Comment') }}
def sapa_{{ app_config.username|lower|replace(' ', '_') }}():
    print('{{ _t('Example Print Message') }}')
```

{{ _t('Enter Text Click Convert PDF') }}" 
style="min-height:450px; width:100%; font-family: 'Consolas', 'Monaco', monospace; padding: 1.2rem; border-radius: 12px; border: 1px solid var(--border); line-height: 1.6; font-size: 1rem;"></textarea>

    <div id="md-status" style="margin-top:1rem; font-size:.9rem; font-weight: 500; min-height: 24px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
/**
 * Memuat konten {{ _t('From Of') }} file lokal ke dalam textarea
 */
function loadFile(f) {
    if (!f) return;
    const name = f.name.replace(/\.[^.]+$/, "");
    document.getElementById("file-name").value = name;
    
    const reader = new FileReader();
    const status = document.getElementById("md-status");
    
    reader.onload = e => { 
        document.getElementById("md-input").value = e.target.result; 
        status.innerHTML = `<span style="color:var(--primary)"><i class="bi bi-info-circle"></i> File "${f.name}" ber{{ _t('result') }} dimuat.</span>`;
    };
    
    reader.onerror = () => {
        status.innerHTML = `<span style="color:var(--danger)">{{ _t('Failed Read File') }}</span>`;
    };
    
    reader.readAsText(f);
}

/**
 * Mengirim data ke backend untuk dikonversi menjadi PDF
 */
async function convertMD() {
    const md = document.getElementById("md-input").value;
    const status = document.getElementById("md-status");
    const fileNameInput = document.getElementById("file-name").value || "dokumen";

    if (!md.trim()) { 
        status.innerHTML = `<span style="color:var(--danger)">{{ _t('Content Empty') }}</span>`; 
        return; 
    }

    const fd = new FormData();
    fd.append("markdown", md);
    fd.append("page_size", document.getElementById("page-size").value);
    fd.append("font_size", document.getElementById("font-size").value);
    fd.append("file_name", fileNameInput);

    status.innerHTML = `<span style="color:var(--primary)"><i class="bi bi-hourglass-split"></i> {{ _t('Crafting PDF') }}</span>`;
    
    try {
        const response = await fetch("/convert/md-to-pdf", { 
            method: "POST", 
            body: fd 
        });
        
        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.error || "Gagal melakukan konversi.");
        }
        
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        
        link.href = url;
        link.download = fileNameInput + ".pdf";
        document.body.appendChild(link); 
        link.click(); 
        link.remove();
        
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.innerHTML = `<span style="color:var(--success)"><i class="bi bi-check-circle"></i> {{ _t('Success PDF Ready') }}</span>`;
        
    } catch (error) {
        status.innerHTML = `<span style="color:var(--danger)"><i class="bi bi-exclamation-triangle"></i> Terjadi kesalahan: ${error.message}</span>`;
    }
}
</script>
