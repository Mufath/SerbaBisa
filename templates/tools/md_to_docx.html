{% extends "base.html" %}
{% block title %}{{ _t('Md To Docx Title') }} - SerbaBisa{% endblock %}
{% block top_title %}{{ _t('Md To Docx Title') }}{% endblock %}

{% block content %}
<div class="client-tool">
    <div class="tool-header">
        <h1>{{ _t('Md To Docx Title') }}</h1>
        <p>{{ _t('Desc Md To Docx') }}</p>
    </div>

    <div style="display:flex; gap:1.2rem; margin-bottom:1rem; flex-wrap:wrap; align-items:center; background: var(--bg-card); padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
        <div style="display: flex; align-items: center; gap: 0.8rem; flex: 1;">
            <label for="file-name" style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; margin: 0;">{{ _t('Label Output Filename') }}</label>
            <input type="text" id="file-name" value="laporan_{{ app_config.username|lower|replace(' ', '_') }}" style="width:200px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text); outline: none;">
        </div>
        
        <div style="display: flex; gap: 0.8rem; align-items: center;">
            <input type="file" id="md-upload" accept=".md,.markdown,.txt" style="display:none" onchange="loadFile(this.files[0])">
            <button type="button" class="btn btn-outline" style="padding: 0.6rem 1rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;" onclick="document.getElementById('md-upload').click()">
                <i class="bi bi-folder2-open"></i> {{ _t('Open File') }}
            </button>
            <button class="btn btn-primary" style="padding: 0.6rem 1.2rem; display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;" onclick="convertMD()">
                <i class="bi bi-file-word-fill"></i> {{ _t('Convert To Docx') }}
            </button>
        </div>
    </div>

    <textarea id="md-input" placeholder="# {{ _t('Lab Report Title') }}

{{ _t('Write Draft Report Here') }}

- {{ _t('Auto Structure Maintained') }}
- {{ _t('Support Formula Code') }}
- {{ _t('Fast Export Office') }}

```python
{{ _t('Example Code Comment') }}
def sapa_{{ app_config.username|lower|replace(' ', '_') }}():
    print('{{ _t('Example Print Message') }}')
```

{{ _t('Enter Text Click Convert Word') }}"
style="min-height:480px; width:100%; font-family: 'Consolas', 'Monaco', monospace; padding: 1.2rem; border-radius: 12px; border: 1px solid var(--border); line-height: 1.6; font-size: 1rem;"></textarea>

    <div id="md-status" style="margin-top:1rem; font-size:0.9rem; font-weight: 500; min-height: 24px;"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
/**
 * Memasukkan konten {{ _t('From Of') }} file .md yang dipilih ke editor
 */
function loadFile(f) {
    if (!f) return;
    const nameWithoutExt = f.name.replace(/\.[^.]+$/, "");
    document.getElementById("file-name").value = nameWithoutExt;
    
    const reader = new FileReader();
    const status = document.getElementById("md-status");
    
    reader.onload = e => { 
        document.getElementById("md-input").value = e.target.result; 
        status.innerHTML = `<span style="color:var(--primary)"><i class="bi bi-check2-circle"></i> Ber{{ _t('result') }} memuat "${f.name}"</span>`;
    };
    
    reader.onerror = () => {
        status.innerHTML = `<span style="color:var(--danger)">{{ _t('Failed Read Local File') }}</span>`;
    };
    
    reader.readAsText(f);
}

/**
 * Mengirim konten Markdown ke backend Flask untuk dijadikan DOCX
 */
async function convertMD() {
    const mdContent = document.getElementById("md-input").value;
    const statusDisplay = document.getElementById("md-status");
    const fileName = document.getElementById("file-name").value || "dokumen";

    if (!mdContent.trim()) { 
        statusDisplay.innerHTML = `<span style="color:var(--danger)"><i class="bi bi-exclamation-triangle"></i> {{ _t('Fill Markdown First') }}</span>`; 
        return; 
    }

    const formData = new FormData();
    formData.append("markdown", mdContent);
    formData.append("file_name", fileName);

    statusDisplay.innerHTML = `<span style="color:var(--primary)"><i class="bi bi-hourglass-split"></i> {{ _t('Processing Docx') }}</span>`;
    
    try {
        const response = await fetch("/convert/md-to-docx", { 
            method: "POST", 
            body: formData 
        });
        
        if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || "Gagal menghubungi server konversi.");
        }
        
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        
        link.href = url;
        link.download = fileName + ".docx";
        document.body.appendChild(link); 
        link.click(); 
        link.remove();
        
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        statusDisplay.innerHTML = `<span style="color:var(--success)"><i class="bi bi-check-circle-fill"></i> Ber{{ _t('result') }}! File "${fileName}.docx" telah diunduh.</span>`;
        
    } catch (err) {
        statusDisplay.innerHTML = `<span style="color:var(--danger)"><i class="bi bi-x-octagon-fill"></i> {{ _t('to') }}salahan: ${err.message}</span>`;
    }
}
</script>
{% endblock %}
