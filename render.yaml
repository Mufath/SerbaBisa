services:
  - type: web
    name: serbabisa
    env: docker
    plan: free
    region: singapore # Pilih region terdekat dengan Indonesia
    numInstances: 1
    disk:
      name: serbabisa-data
      mountPath: /app/data
      sizeGB: 1 # 1GB sudah cukup untuk config & history JSON
    envVars:
      - key: PORT
        value: 5000
      - key: SERBABISA_DESKTOP
        value: "false"
